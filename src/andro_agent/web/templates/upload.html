{% extends "base.html" %}

{% block title %}Upload APK - Andro-Agent{% endblock %}

{% block content %}
<section class="page-header">
  <div>
    <p class="eyebrow">New scan</p>
    <h1>Subir APK</h1>
    <p class="muted">El análisis se ejecutará en segundo plano y podrás seguir el estado desde el detalle del caso.</p>
  </div>
</section>

<section class="panel upload-panel">
  <form action="/upload" method="post" enctype="multipart/form-data">
    <label class="dropzone">
      <span>Selecciona un APK</span>
      <input type="file" name="file" accept=".apk" required>
    </label>

    <label class="field">
      <span>Perfil de análisis</span>
      <select name="analysis_profile">
        <option value="no-llm">Static deterministic</option>
        <option value="fast">Static fast</option>
        <option value="full">Static full + agentic</option>
      </select>
    </label>

    <label class="field">
      <span>Agentic mode</span>
      <select name="agentic_mode">
        <option value="none">None</option>
        <option value="single">Single agent</option>
      </select>
    </label>

    <label class="field">
      <span>Agentic budget</span>
      <select name="agentic_budget">
        <option value="conservative">Conservative</option>
        <option value="balanced" selected>Balanced</option>
        <option value="deep">Deep</option>
      </select>
    </label>

    <label class="field">
      <span>LLM provider</span>
      <select name="llm_provider">
        <option value="openrouter">OpenRouter</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
        <option value="kimi">Kimi/Moonshot</option>
        <option value="ollama">Ollama/local</option>
      </select>
    </label>

    <label class="field">
      <span>LLM model</span>
      <input type="text" name="llm_model" placeholder="e.g. gpt-5.5, deepseek-v4-flash, or kimi-k2.5">
    </label>

    <button class="button" type="submit">Start scan</button>
  </form>
</section>
{% endblock %}
